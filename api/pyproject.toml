[project]
name = "sentinela-api"
version = "0.1.0"
description = "API do Sentinela Urbano: vigilância comunitária de risco de arbovirose"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "tzdata>=2024.2",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pypdf>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testes que precisam do PostgreSQL/PostGIS (pulados se o banco não estiver acessível)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter wraps code; long user-facing strings are left intact.
ignore = ["E501"]
